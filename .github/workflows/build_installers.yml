name: Build Smart Installers

# Triggers on every version tag push (e.g. v1.2.0)
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:   # allows manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  build-and-release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            installer_name: WhisperUtilitySetup_Windows.exe
            pyinstaller_name: WhisperUtilitySetup_Windows
            app_artifact: whisper_app_win.zip
            requirements: requirements_cpu.txt
          - os: macos-latest
            installer_name: WhisperUtilitySetup_macOS
            pyinstaller_name: WhisperUtilitySetup_macOS
            app_artifact: whisper_app_mac.zip
            requirements: requirements_macos.txt
          - os: ubuntu-latest
            installer_name: WhisperUtilitySetup_Linux
            pyinstaller_name: WhisperUtilitySetup_Linux
            app_artifact: whisper_app_linux.zip
            requirements: requirements_linux.txt

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate release version metadata
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          release_version = os.environ["RELEASE_TAG"].removeprefix("v")
          version_globals = {}
          exec(Path("version.py").read_text(encoding="utf-8"), version_globals)
          repository = version_globals["REPOSITORY"]
          if version_globals["APP_VERSION"] != release_version:
              raise SystemExit(
                  f"version.py has {version_globals['APP_VERSION']}, "
                  f"but the release tag is {release_version}"
              )

          manifest_path = Path("installer/manifest.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          if manifest["version"] != release_version:
              raise SystemExit(
                  f"manifest.json has {manifest['version']}, "
                  f"but the release tag is {release_version}"
              )
          for key, url in manifest["components"]["app_core"].items():
              expected = (
                  f"https://github.com/{repository}/releases/download/"
                  f"v{release_version}/{url.rsplit('/', 1)[-1]}"
              )
              if url != expected:
                  raise SystemExit(f"app_core URL for {key} is not release-aligned: {url}")
          PY

      - name: Set up uv & Python 3.11
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg libgirepository1.0-dev gcc libcairo2-dev pkg-config python3-dev gir1.2-gtk-3.0 libwebkit2gtk-4.1-dev

      - name: Install Python dependencies for app core
        run: |
          uv pip install -r ${{ matrix.requirements }}
          uv pip install pyinstaller

      - name: Build Core Application
        run: uv run python tools/build_release.py

      - name: Build Installer Binary
        run: |
          uv run pyinstaller \
            --onefile \
            --noconsole \
            --noupx \
            --noconfirm \
            --name "${{ matrix.pyinstaller_name }}" \
            --icon "logo.ico" \
            --add-data "installer/manifest.json:." \
            --add-data "logo.ico:." \
            installer/installer_main.py
        shell: bash

      - name: Prepare artifact (macOS)
        if: runner.os == 'macOS' && matrix.pyinstaller_name != matrix.installer_name
        run: mv dist/${{ matrix.pyinstaller_name }} dist/${{ matrix.installer_name }}

      - name: Prepare artifact (Linux)
        if: runner.os == 'Linux' && matrix.pyinstaller_name != matrix.installer_name
        run: mv dist/${{ matrix.pyinstaller_name }} dist/${{ matrix.installer_name }}

      - name: Upload installer and app core as release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/${{ matrix.installer_name }}
            dist/${{ matrix.app_artifact }}
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload manifest.json (once, from ubuntu runner)
        if: runner.os == 'Linux' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: installer/manifest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
