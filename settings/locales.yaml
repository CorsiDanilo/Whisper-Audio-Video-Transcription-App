  config_modal_title: ℹ️ Guida ai File di Configurazione
  config_modal_btn: ℹ️ Spiegazione File
  config_modal_close_btn: ✕ Chiudi
  config_modal_default_yaml_title: 📄 `settings/default.yaml` (Impostazioni di Sistema
    e Modello)
  config_modal_default_yaml_desc: '- **device**: Dispositivo di elaborazione (`cpu`
    o `cuda` per GPU NVIDIA).

    - **whisper_model**: Alias del modello Whisper (es. `turbo`, `small`, `distil-large-v3`).

    - **cpu_threads / num_workers**: Controllo del parallelismo per elaborazione CPU.

    - **compute_type**: Precisione dei calcoli (`float16`, `int8`, `float32`).

    - **temperature / beam_size / batch_size**: Parametri di trascrizione per bilanciare
    accuratezza e velocità.

    - **word_timestamps**: Abilita il tracciamento dei timestamp parola per parola.'
  config_modal_gemini_yaml_title: 🔑 `secrets/gemini.yaml` (Credenziali API Gemini)
  config_modal_gemini_yaml_desc: '- **api_key**: La tua chiave API personale per Google
    Gemini.

    - **model**: Modello Gemini selezionato (es. `gemini-1.5-flash`, `gemini-1.5-pro`).

    - **temperature**: Controlla la creatività nelle risposte dell''assistente AI.

    - **system_prompt**: Istruzioni di base inviate al modello AI per le trascrizioni.'
  select_config_file_label: Seleziona File di Configurazione
  config_content_label: Contenuto File (YAML)
  save_config_file_btn: 💾 Salva File
  open_in_notepad_btn: 📝 Apri in Editor di Testo
  file_saved_toast: File salvato con successo!
  explanation_accordion: ℹ️ Spiegazione
  explanation_text: '- **Dispositivo**: Determina il dispositivo da utilizzare per
    l''elaborazione (CPU o GPU).

    - **Thread CPU**: Determina il numero di thread da utilizzare (valori più alti
    possono migliorare la velocità ma richiedono più risorse CPU).

    - **Numero di Worker**: Determina il numero di worker (valori più alti possono
    velocizzare ma richiedono più memoria).

    - **Lingua**: Determina la lingua del file audio.

    - **Dimensione Modello**: Determina il modello Whisper. `turbo` è un''opzione
    multilingua veloce; i modelli `distil-*` sono più veloci ma utili principalmente
    per l''inglese.

    - **Condiziona su Testo Precedente**: Se selezionato, il modello considererà il
    testo precedente durante la trascrizione. Si consiglia di disabilitarlo per i
    modelli `distil-*`.

    - **Timestamp per parola**: Se selezionato, fornirà timestamp per ogni parola.

    - **Tipo di Calcolo**: Determina la precisione dei calcoli (precisione maggiore
    = più accurato ma più lento).

    - **Temperatura**: Determina la casualità delle previsioni (valori più alti introducono
    più errori ma possono migliorare la diversità).

    - **Dimensione Beam**: Determina il numero di percorsi di trascrizione possibili
    da considerare (valori più alti migliorano l''accuratezza ma richiedono più tempo).

    - **Dimensione Batch**: Determina il numero di file audio da elaborare contemporaneamente
    (valori più alti migliorano la velocità ma richiedono più memoria).'
  config_file_path_label: Percorso file di configurazione
  config_file_path_placeholder: C:\percorso\al\config.yaml
  open_config_file_btn: 📝 Apri File di Configurazione (settings/default.yaml)
  open_config_file_toast: Aperto il file di configurazione settings/default.yaml nell'editor
    di sistema.
  configure_gemini_key_btn: 🔑 Configura API Key Gemini (secrets/gemini.yaml)
  gemini_config_opened_toast: Aperto il file secrets/gemini.yaml nell'editor di sistema.
  device_label: Dispositivo
