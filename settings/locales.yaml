  config_modal_default_yaml_title: 📄 `settings/default.yaml` (System & Model Configurations)
  config_modal_default_yaml_desc: '- **device**: Processing backend (`cpu` or `cuda`
    for NVIDIA GPU).

    - **whisper_model**: Model checkpoint alias (e.g., `turbo`, `small`, `distil-large-v3`).

    - **cpu_threads / num_workers**: Parallelism control for CPU operations.

    - **compute_type**: Calculation precision (`float16`, `int8`, `float32`).

    - **temperature / beam_size / batch_size**: Decoding options for precision vs
    speed.

    - **word_timestamps**: Enable precise word-level timing in output transcripts.'
  config_modal_gemini_yaml_title: 🔑 `secrets/gemini.yaml` (Gemini API Credentials)
  config_modal_gemini_yaml_desc: '- **api_key**: Your personal Google Gemini API key.

    - **model**: Gemini model alias (e.g. `gemini-1.5-flash`, `gemini-1.5-pro`).

    - **temperature**: Controls creativity in post-processing summaries/fixes.

    - **system_prompt**: Default instructions passed to the AI assistant.'
  select_config_file_label: Select Configuration File
  config_content_label: File Content (YAML)
  save_config_file_btn: 💾 Save File
  open_in_notepad_btn: 📝 Open in Text Editor
  file_saved_toast: File saved successfully!
  explanation_accordion: ℹ️ Explanation
  explanation_text: '- **Device**: Determines the device to use for processing (CPU
    or GPU).

    - **CPU Threads**: Determines the number of threads to use for processing (higher
    values may improve processing speed but require more CPU resources).

    - **Number of Workers**: Determines the number of workers to use for processing
    (higher values may improve processing speed but require more memory).

    - **Language**: Determines the language of the audio file.

    - **Model Size**: Determines the Whisper model alias. `turbo` is a fast multilingual
    option; `distil-*` models are faster distilled checkpoints, mainly useful for
    English speech recognition.

    - **Condition on Previous Text**: If checked, the model will consider the previous
    text when transcribing the current text. Disabling it is recommended for `distil-*`
    models.

    - **Word-level timestamps**: If checked, the model will provide timestamps for
    each word in the transcription.

    - **Computational Type**: Determines the precision of the model''s calculations
    (higher precision is more accurate but slower).

    - **Temperature**: Determines the randomness of the model''s predictions (higher
    values may introduce more errors but can improve diversity).

    - **Beam Size**: Determines the number of possible transcription paths to consider
    (higher values may improve accuracy but require more processing time).

    - **Batch Size**: Determines the number of audio files to process simultaneously
    (higher values may improve processing speed but require more memory).'
  config_file_path_label: Configuration file path
